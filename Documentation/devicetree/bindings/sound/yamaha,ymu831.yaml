%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/yamaha,ymu831.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Yamaha YMU831 audio hub CODEC

maintainers:
  - Davids Paskevics <davids.paskevics@gmail.com>

description:
  The Yamaha YMU831 is an audio CODEC with a class-D speaker amplifier,
  headphone, receiver and line outputs, analog and digital microphone
  inputs, headset detection and several DSPs. It is controlled over SPI.

allOf:
  - $ref: dai-common.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: yamaha,ymu831

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description:
      Interrupt output, signalling headset detection and DSP events.

  clocks:
    items:
      - description: master clock (MCLK)

  clock-names:
    items:
      - const: mclk

  dvdd-supply:
    description:
      External supply for the digital core, used while the CODEC's internal
      digital LDO is off. Without it, the internal LDO is used throughout.

  mic1-bias-supply:
    description:
      External bias supply for microphone 1, enabled while the microphone is
      in use.

  yamaha,dio-ports:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      The digital audio interface pins (0 for DIO0 to 2 for DIO2) the music,
      ext, voice and HiFi ports are wired to.
    items:
      enum: [0, 1, 2]
    minItems: 4
    maxItems: 4
    default: [0, 2, 1, 0]

  "#sound-dai-cells":
    const: 1
    description: |
      The digital audio interfaces:
        0: music port
        1: ext port
        2: voice port

required:
  - compatible
  - reg
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        audio-codec@0 {
            compatible = "yamaha,ymu831";
            reg = <0>;
            spi-max-frequency = <10000000>;
            interrupt-parent = <&gpx1>;
            interrupts = <4 IRQ_TYPE_EDGE_FALLING>;
            clocks = <&pmu_system_controller 0>;
            clock-names = "mclk";
            dvdd-supply = <&codec_dvdd>;
            #sound-dai-cells = <1>;
        };
    };
